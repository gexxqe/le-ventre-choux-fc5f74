<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173c2b">
<title>Administration — Le Ventre à Choux</title>
<style>
:root{--brand:#173c2b;--accent:#d7a94c;--cream:#f7f2e8;--paper:#fffdf8;--ink:#1d2923;--muted:#6e766f;--line:#e7ded0;--ok:#2f8a57;--danger:#b94b45}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.hidden{display:none!important}.shell{max-width:1100px;margin:auto;padding:0 18px}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px}.card{width:min(450px,100%);box-shadow:0 20px 60px rgba(23,60,43,.12)}h1,h2,h3{font-family:Georgia,serif;color:var(--brand)}h1{font-size:34px;margin:8px 0}.muted{color:var(--muted);line-height:1.55}.field{display:grid;gap:6px;margin-top:13px}.field label{font-size:13px;font-weight:800;color:var(--brand)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:white}.btn{border:0;border-radius:999px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--accent),#edca78);color:#2e260f}.secondary{background:white;border:1px solid var(--line);color:var(--brand)}.danger{background:#fff0ee;color:var(--danger);border:1px solid #efcbc7}.top{position:sticky;top:0;background:rgba(247,242,232,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:10}.topin{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-family:Georgia,serif;font-weight:800;color:var(--brand)}.tabs{display:flex;gap:8px;overflow:auto;padding:18px 0}.tab{white-space:nowrap}.tab.active{background:var(--brand);color:white}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{background:white;border:1px solid var(--line);border-radius:18px;padding:16px}.stat b{display:block;font-size:26px;color:var(--brand)}.reservation,.row{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}.rhead{display:flex;justify-content:space-between;gap:12px}.pill{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px}.pending{background:#fff6db;color:#856719}.confirmed{background:#eaf7ef;color:#226c43}.declined{background:#fff0ee;color:#a33e38}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:12px 0}.error{color:var(--danger);font-weight:700;margin-top:10px}.ok{color:var(--ok);font-weight:700;margin-top:10px}.small{font-size:12px;color:var(--muted)}.checkrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:14px}.checkrow label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--brand)}.checkrow input{width:auto}.menu-title{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.menu-title h3{margin:0 0 4px}.tag{display:inline-block;font-size:11px;font-weight:800;padding:4px 7px;border-radius:999px;background:#eef4ef;color:var(--brand);margin-right:5px}@media(max-width:720px){.stats,.grid,.grid3{grid-template-columns:1fr}.topin{align-items:flex-start;padding:12px 0;flex-direction:column}.rhead,.menu-title{flex-direction:column}}
</style>
</head>
<body>
<section id="authView" class="login"><div class="card"><div style="font-size:34px">🔐</div><h1>Espace Restaurateur</h1><p class="muted">Connexion sécurisée via Supabase.</p><form id="authForm"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Mot de passe</label><input id="password" type="password" minlength="8" autocomplete="current-password" required></div><button class="btn primary" type="submit" style="width:100%;margin-top:16px">Se connecter</button></form><button id="signupBtn" class="btn secondary" style="width:100%;margin-top:10px">Créer mon compte administrateur</button><div id="authMsg" class="small" style="margin-top:12px"></div></div></section>
<div id="pendingView" class="login hidden"><div class="card"><h1>Compte créé</h1><p class="muted">Le compte existe, mais il n'a pas encore les droits administrateur.</p><button id="pendingLogout" class="btn secondary">Déconnexion</button></div></div>
<div id="app" class="hidden"><header class="top"><div class="shell topin"><div class="brand">🍴 Le Ventre à Choux — Admin</div><div><a class="btn secondary" href="index.html">Voir le site</a> <button id="logout" class="btn secondary">Déconnexion</button></div></div></header><main class="shell" style="padding-bottom:60px"><div class="tabs"><button class="btn tab active" data-tab="reservations">Réservations</button><button class="btn tab secondary" data-tab="menu">Carte & Plats</button><button class="btn tab secondary" data-tab="hours">Horaires</button><button class="btn tab secondary" data-tab="info">Infos & Contact</button></div>
<section id="reservations" class="view"><div class="toolbar"><h2>Réservations</h2><button id="refresh" class="btn secondary">Actualiser</button></div><div class="stats"><div class="stat"><span class="small">Total</span><b id="total">0</b></div><div class="stat"><span class="small">En attente</span><b id="pending">0</b></div><div class="stat"><span class="small">Confirmées</span><b id="confirmed">0</b></div></div><div id="reservationList"></div></section>
<section id="menu" class="view hidden"><div class="toolbar"><h2>Carte & Plats</h2><button id="reloadMenu" class="btn secondary">Actualiser</button></div>
<div class="panel"><h3 style="margin-top:0">Ajouter un plat</h3><div class="grid3"><div class="field"><label>Catégorie</label><select id="newCategory"><option>Formules</option><option>Entrées</option><option>Plats</option><option>Options végétariennes</option><option>Desserts</option><option>Boissons</option></select></div><div class="field"><label>Nom</label><input id="newName" placeholder="Nom du plat"></div><div class="field"><label>Prix (€)</label><input id="newPrice" type="number" min="0" step="0.10" placeholder="0.00"></div></div><div class="field"><label>Description</label><textarea id="newDescription" rows="3" placeholder="Description du plat"></textarea></div><div class="checkrow"><label><input id="newVegetarian" type="checkbox"> Végétarien</label><label><input id="newAvailable" type="checkbox" checked> Disponible</label><label><input id="newDaily" type="checkbox"> Plat du jour</label></div><div class="actions"><button id="addDish" class="btn primary">Ajouter à la carte</button></div><div id="menuMsg" class="small"></div></div>
<div id="menuList"></div></section>
<section id="hours" class="view hidden"><div class="toolbar"><h2>Horaires</h2><button id="saveHours" class="btn primary">Enregistrer</button></div><div id="hoursList"></div></section>
<section id="info" class="view hidden"><h2>Infos & Contact</h2><div class="panel"><div class="grid"><div class="field"><label>Nom</label><input id="rName"></div><div class="field"><label>Téléphone</label><input id="rPhone"></div><div class="field"><label>Adresse</label><input id="rAddress"></div><div class="field"><label>Ville</label><input id="rCity"></div><div class="field"><label>E-mail</label><input id="rEmail"></div></div><button id="saveInfo" class="btn primary" style="margin-top:14px">Enregistrer</button><div id="infoMsg" class="small"></div></div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ogyjqnbqvihqjikidrya.supabase.co';
const SUPABASE_KEY='sb_publishable_Y5a2AS18uYJhzxh0-GYa0g_VWtSwgFz';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const authView=document.getElementById('authView'),pendingView=document.getElementById('pendingView'),app=document.getElementById('app'),authMsg=document.getElementById('authMsg');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function isAdmin(user){const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return !error&&!!data}
async function route(){const {data:{session}}=await db.auth.getSession();authView.classList.add('hidden');pendingView.classList.add('hidden');app.classList.add('hidden');if(!session){authView.classList.remove('hidden');return}if(await isAdmin(session.user)){app.classList.remove('hidden');await loadAll()}else pendingView.classList.remove('hidden')}
authForm.addEventListener('submit',async e=>{e.preventDefault();authMsg.textContent='Connexion…';const {error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){authMsg.className='error';authMsg.textContent=error.message}else{authMsg.textContent='';route()}});
signupBtn.onclick=async()=>{if(!email.value||password.value.length<8){authMsg.className='error';authMsg.textContent='Entre un e-mail et un mot de passe d’au moins 8 caractères.';return}const {error}=await db.auth.signUp({email:email.value.trim(),password:password.value});authMsg.className=error?'error':'ok';authMsg.textContent=error?error.message:'Compte créé. Confirme l’e-mail si nécessaire.';if(!error)setTimeout(route,700)};
logout.onclick=pendingLogout.onclick=async()=>{await db.auth.signOut();route()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden')});
async function loadReservations(){const {data,error}=await db.from('reservations').select('*').order('created_at',{ascending:false});if(error){reservationList.innerHTML='<div class="error">'+esc(error.message)+'</div>';return}total.textContent=data.length;pending.textContent=data.filter(x=>x.status==='pending').length;confirmed.textContent=data.filter(x=>x.status==='confirmed').length;reservationList.innerHTML=data.length?data.map(r=>`<div class="reservation"><div class="rhead"><div><b>${esc(r.customer_name)}</b><div class="small">${esc(r.guest_count)} personne(s) • ${esc(r.reservation_date)} à ${esc(r.reservation_time)} • ${esc(r.phone)}</div></div><span class="pill ${r.status}">${r.status==='pending'?'En attente':r.status==='confirmed'?'Confirmée':'Refusée'}</span></div>${r.message?`<div class="small" style="margin-top:8px">“${esc(r.message)}”</div>`:''}<div class="actions"><button class="btn primary" onclick="setStatus('${r.id}','confirmed')">Confirmer</button><button class="btn secondary" onclick="setStatus('${r.id}','declined')">Refuser</button><button class="btn danger" onclick="removeReservation('${r.id}')">Supprimer</button></div></div>`).join(''):'<div class="panel muted">Aucune réservation.</div>'}
window.setStatus=async(id,status)=>{await db.from('reservations').update({status,updated_at:new Date().toISOString()}).eq('id',id);loadReservations()};window.removeReservation=async id=>{if(confirm('Supprimer cette réservation ?')){await db.from('reservations').delete().eq('id',id);loadReservations()}};refresh.onclick=loadReservations;
async function loadMenu(){const {data,error}=await db.from('menu_items').select('*').order('sort_order').order('created_at');if(error){menuList.innerHTML='<div class="error">'+esc(error.message)+'</div>';return}menuList.innerHTML=data.length?data.map(x=>`<div class="row"><div class="menu-title"><div><h3>${esc(x.name)}</h3><span class="tag">${esc(x.category)}</span>${x.is_vegetarian?'<span class="tag">🌿 Végétarien</span>':''}${!x.is_available?'<span class="tag">Masqué</span>':''}</div><b>${Number(x.price).toFixed(2).replace('.',',')} €</b></div><div class="grid3"><div class="field"><label>Nom</label><input id="n_${x.id}" value="${esc(x.name)}"></div><div class="field"><label>Catégorie</label><input id="c_${x.id}" value="${esc(x.category)}"></div><div class="field"><label>Prix (€)</label><input id="p_${x.id}" type="number" step="0.10" value="${Number(x.price).toFixed(2)}"></div></div><div class="field"><label>Description</label><textarea id="d_${x.id}" rows="2">${esc(x.description)}</textarea></div><div class="actions"><button class="btn primary" onclick="saveDish('${x.id}')">Enregistrer</button><button class="btn secondary" onclick="toggleDish('${x.id}',${x.is_available})">${x.is_available?'Masquer':'Afficher'}</button><button class="btn danger" onclick="deleteDish('${x.id}',${JSON.stringify(x.name)})">Supprimer</button></div></div>`).join(''):'<div class="panel muted">Aucun plat dans la carte.</div>'}
window.saveDish=async id=>{const payload={name:document.getElementById('n_'+id).value.trim(),category:document.getElementById('c_'+id).value.trim(),description:document.getElementById('d_'+id).value.trim(),price:Number(document.getElementById('p_'+id).value),updated_at:new Date().toISOString()};const {error}=await db.from('menu_items').update(payload).eq('id',id);if(error)alert(error.message);else loadMenu()};
window.toggleDish=async(id,current)=>{const {error}=await db.from('menu_items').update({is_available:!current,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else loadMenu()};
window.deleteDish=async(id,name)=>{if(!confirm(`Supprimer « ${name} » de la carte ?`))return;const {error}=await db.from('menu_items').delete().eq('id',id);if(error)alert(error.message);else loadMenu()};
addDish.onclick=async()=>{menuMsg.className='small';menuMsg.textContent='Ajout…';const name=newName.value.trim(),category=newCategory.value.trim(),price=Number(newPrice.value);if(!name||!category||Number.isNaN(price)){menuMsg.className='error';menuMsg.textContent='Nom, catégorie et prix sont obligatoires.';return}const {data:maxRow}=await db.from('menu_items').select('sort_order').order('sort_order',{ascending:false}).limit(1).maybeSingle();const payload={name,category,description:newDescription.value.trim(),price,is_vegetarian:newVegetarian.checked,is_available:newAvailable.checked,is_daily_special:newDaily.checked,sort_order:(maxRow?.sort_order??0)+1};const {error}=await db.from('menu_items').insert(payload);if(error){menuMsg.className='error';menuMsg.textContent=error.message;return}newName.value='';newPrice.value='';newDescription.value='';newVegetarian.checked=false;newAvailable.checked=true;newDaily.checked=false;menuMsg.className='ok';menuMsg.textContent='Plat ajouté ✅';await loadMenu()};reloadMenu.onclick=loadMenu;
async function loadHours(){const {data,error}=await db.from('opening_hours').select('*').order('day_index');if(error)return;hoursList.innerHTML=data.map(x=>`<div class="row"><b>${esc(x.day_name)}</b><div class="grid"><div class="field"><label>Midi</label><input id="hl_${x.day_index}" value="${esc(x.is_closed?'Fermé':(x.lunch_start||'')+'-'+(x.lunch_end||''))}"></div><div class="field"><label>Soir</label><input id="hd_${x.day_index}" value="${esc(x.is_closed?'Fermé':(x.dinner_start||'')+'-'+(x.dinner_end||''))}"></div></div></div>`).join('')}
saveHours.onclick=async()=>{for(let i=0;i<7;i++){const l=document.getElementById('hl_'+i).value.trim(),d=document.getElementById('hd_'+i).value.trim(),closed=/fermé/i.test(l)||/fermé/i.test(d),ls=l.split('-'),ds=d.split('-');await db.from('opening_hours').update({is_closed:closed,lunch_start:closed?null:(ls[0]||null),lunch_end:closed?null:(ls[1]||null),dinner_start:closed?null:(ds[0]||null),dinner_end:closed?null:(ds[1]||null)}).eq('day_index',i)}alert('Horaires enregistrés');loadHours()};
async function loadInfo(){const {data}=await db.from('restaurant_settings').select('*').eq('id',1).single();if(!data)return;rName.value=data.name;rPhone.value=data.phone;rAddress.value=data.address;rCity.value=data.city_postcode;rEmail.value=data.email}
saveInfo.onclick=async()=>{const {error}=await db.from('restaurant_settings').update({name:rName.value,phone:rPhone.value,address:rAddress.value,city_postcode:rCity.value,email:rEmail.value,updated_at:new Date().toISOString()}).eq('id',1);infoMsg.textContent=error?error.message:'Enregistré ✅'};
async function loadAll(){await Promise.all([loadReservations(),loadMenu(),loadHours(),loadInfo()])}
route();
</script>
</body></html>
