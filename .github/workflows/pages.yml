name: Deploy web to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          cp -R web _site
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('_site/index.html')
          html = index.read_text(encoding='utf-8')

          backend_tag = '<script src="./backend.js?v=20260917-6"></script>'
          if 'backend.js' not in html:
              html = html.replace('</body>', f'{backend_tag}\n</body>')
          else:
              html = re.sub(r'<script src="\./backend\.js(?:\?v=[^"]*)?"></script>', backend_tag, html)

          fixes_tag = '<script src="./public-fixes.js?v=20260917-1"></script>'
          if 'public-fixes.js' not in html:
              html = html.replace('</body>', f'{fixes_tag}\n</body>')
          else:
              html = re.sub(r'<script src="\./public-fixes\.js(?:\?v=[^"]*)?"></script>', fixes_tag, html)

          facebook_url = 'https://www.facebook.com/p/Le-ventre-%C3%A0-choux-61575062150981/'
          facebook_card = f'<a href="{facebook_url}" target="_blank" rel="noreferrer"><span style="font-weight:900;font-family:Arial,sans-serif;color:#1877F2">f</span>Facebook</a>'
          if facebook_url not in html:
              marker = '<a href="#menu"><span>🍴</span>Menu</a>'
              html = html.replace(marker, facebook_card + marker)

          html = html.replace('.quick{display:grid;grid-template-columns:repeat(4,1fr);', '.quick{display:grid;grid-template-columns:repeat(5,1fr);')
          index.write_text(html, encoding='utf-8')

          admin = Path('_site/admin.html')
          html = admin.read_text(encoding='utf-8')
          admin_tag = '<script src="./admin-fix.js?v=20260917-3"></script>'
          if 'admin-fix.js' not in html:
              html = html.replace('</body>', f'{admin_tag}\n</body>')
          else:
              html = re.sub(r'<script src="\./admin-fix\.js(?:\?v=[^"]*)?"></script>', admin_tag, html)
          admin.write_text(html, encoding='utf-8')
          PY

      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
