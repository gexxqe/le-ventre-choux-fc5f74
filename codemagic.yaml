workflows:
  ios-test:
    name: Le Ventre Choux - iOS test
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/ios"
          xcodegen generate
          ls -la

      - name: Build iOS
        script: |
          PROJECT=$(find "$CM_BUILD_DIR/ios" -name "*.xcodeproj" -type d | head -n 1)

          echo "Xcode project found:"
          echo "$PROJECT"

          xcodebuild -project "$PROJECT" -list

          xcodebuild build \
            -project "$PROJECT" \
            -scheme "LeVentreChoux" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log