    scripts:
      - name: Build iOS
        script: |
          PROJECT=$(find "$CM_BUILD_DIR" -name "*.xcodeproj" -type d | head -n 1)

          echo "Xcode project found:"
          echo "$PROJECT"

          xcodebuild -project "$PROJECT" -list

          xcodebuild build \
            -project "$PROJECT" \
            -scheme "LeVentreChoux" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO