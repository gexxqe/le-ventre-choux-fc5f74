workflows:
  ios-test:
    name: Le Ventre Choux - iOS test
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Build iOS
        script: |
          xcodebuild build \
            -project "$CM_BUILD_DIR/ios/LeVentreChoux.xcodeproj" \
            -scheme "LeVentreChoux" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log