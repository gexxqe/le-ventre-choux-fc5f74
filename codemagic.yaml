workflows:
  ios-test:
    name: Le Ventre Choux - iOS test
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Build iOS
        script: |
          echo "NEW SCRIPT ACTIVE"
          echo "Current directory:"
          pwd

          echo "Searching for Xcode projects:"
          find "$CM_BUILD_DIR" -maxdepth 5 -name "*.xcodeproj" -print

          PROJECT=$(find "$CM_BUILD_DIR" -name "*.xcodeproj" -type d | head -n 1)

          echo "Xcode project found:"
          echo "$PROJECT"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No .xcodeproj found in repository"
            exit 1
          fi

          echo "Available schemes:"
          xcodebuild -project "$PROJECT" -list

          xcodebuild build \
            -project "$PROJECT" \
            -scheme "LeVentreChoux" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log